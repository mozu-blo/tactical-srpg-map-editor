<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17202a">
  <title>SRPGマップエディタ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div><strong>SRPGマップエディタ</strong><span class="version">v0.1</span></div>
    <div class="top-actions">
      <button id="undo" type="button" disabled>戻る</button>
      <button id="redo" type="button" disabled>進む</button>
      <button id="menu-toggle" type="button" aria-expanded="true">メニューを折りたたむ</button>
    </div>
  </header>
  <main>
    <aside id="controls" class="panel">
      <section>
        <h2>新規マップ</h2>
        <label>マップ名<input id="map-name" value="新しいマップ"></label>
        <div class="row">
          <label>横サイズ<input id="map-width" type="number" min="1" max="64" value="16"></label>
          <label>縦サイズ<input id="map-depth" type="number" min="1" max="64" value="16"></label>
        </div>
        <button id="create-map" type="button">新規作成</button>
      </section>
      <section>
        <h2>地形</h2>
        <div class="mode-grid" role="group" aria-label="主モード">
          <button class="mode active" data-mode="terrain" type="button">地形</button>
          <button class="mode" data-mode="impassable" type="button">侵入禁止</button>
          <button class="mode" data-mode="memo" type="button">メモ</button>
          <button class="mode" data-mode="select" type="button">選択</button>
        </div>
        <div class="segmented" role="group" aria-label="地形の編集方法">
          <button class="terrain-action active" data-action="add" type="button">配置</button>
          <button class="terrain-action" data-action="remove" type="button">消去</button>
        </div>
        <label>配置Height
          <select id="height-amount"></select>
        </label>
        <label>現在色<input id="current-color" type="color" value="#7a8b79"></label>
        <div id="palette" class="palette" aria-label="カラーパレット"></div>
        <div class="switch-list" aria-label="編集設定">
          <label><span>スワイプ連続編集</span><input id="continuous-edit" type="checkbox" role="switch"></label>
          <label><span>X方向連続編集</span><input id="edit-x" type="checkbox" role="switch" checked></label>
          <label><span>Z方向連続編集</span><input id="edit-z" type="checkbox" role="switch" checked></label>
          <label><span>Height変更</span><input id="change-height" type="checkbox" role="switch" checked></label>
        </div>
      </section>
      <section>
        <h2>選択セル</h2>
        <dl class="cell-info">
          <div><dt>X座標</dt><dd id="cell-x">—</dd></div>
          <div><dt>Z座標</dt><dd id="cell-z">—</dd></div>
          <div><dt>Height</dt><dd id="cell-height">—</dd></div>
          <div><dt>色</dt><dd id="cell-color">—</dd></div>
          <div><dt>侵入禁止</dt><dd id="cell-impassable">—</dd></div>
        </dl>
        <div id="cell-editor" hidden>
          <label>Height<input id="selected-height" type="number" min="0" step="0.5"></label>
          <label>色<input id="selected-color" type="color"></label>
          <label class="check-row"><span>侵入禁止</span><input id="selected-impassable" type="checkbox"></label>
          <label>オブジェクトメモ<textarea id="selected-memo" rows="3" maxlength="500" placeholder="例：救助対象、門、弓兵配置候補"></textarea></label>
          <button id="apply-cell" type="button">セル情報を反映</button>
        </div>
      </section>
      <section>
        <h2>カメラ</h2>
        <div class="camera-grid" role="group" aria-label="カメラプリセット">
          <button class="camera-preset" data-preset="top" type="button">真上</button>
          <button class="camera-preset" data-preset="battle45" type="button">戦闘視点1</button>
          <button class="camera-preset" data-preset="battle135" type="button">戦闘視点2</button>
          <button class="camera-preset" data-preset="battle225" type="button">戦闘視点3</button>
          <button class="camera-preset" data-preset="battle315" type="button">戦闘視点4</button>
          <button class="camera-preset" data-preset="front" type="button">正面</button>
          <button class="camera-preset" data-preset="right" type="button">右側面</button>
        </div>
        <div class="switch-list" aria-label="カメラ軸ロック">
          <label><span>X軸ロック</span><input id="lock-x" type="checkbox" role="switch"></label>
          <label><span>Y軸ロック</span><input id="lock-y" type="checkbox" role="switch"></label>
          <label><span>Z軸ロック</span><input id="lock-z" type="checkbox" role="switch"></label>
        </div>
        <p class="hint">X：Pitch、Y：Yaw、Z：Zoomを固定します。</p>
      </section>
    </aside>
    <section id="workspace" aria-label="3Dマップ編集領域">
      <canvas id="map-canvas"></canvas>
      <div id="hud" aria-live="polite">
        <span>モード：<b id="hud-mode">地形・配置</b></span>
        <span>Height：<b id="hud-height">0.5</b></span>
        <span>色：<i id="hud-color"></i></span>
        <span>連続：<b id="hud-continuous">OFF</b></span>
        <span>カメラ：<b id="hud-camera">42° / 45°</b></span>
      </div>
      <div id="help">配置：セルをクリックしてHeightを加算します。</div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
